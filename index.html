<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幼兒園名片產生器</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff8a65">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", 'Microsoft JhengHei', sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #ff8a65;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .span-2 {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            margin-bottom: 6px;
            color: #555;
            font-size: 13px;
        }
        input[type="text"], input[type="file"], select {
            padding: 10px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            width: 100%;
            background-color: #fafafa;
            transition: all 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #ff8a65;
            background-color: #fff;
        }
        .photo-controls {
            grid-column: span 3;
            background: #fff9e6;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #ffcc80;
        }
        .slider-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .slider-group:last-child {
            margin-bottom: 0;
        }
        .slider-group label {
            width: 60px;
            margin-bottom: 0;
            font-size: 13px;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: #ff8a65;
        }
        .canvas-container {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid #eee;
            margin-bottom: 20px;
            position: relative;
            background-color: #eee;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn-download {
            background-color: #ff8a65;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 138, 101, 0.3);
            transition: all 0.2s;
        }
        .btn-download:active {
            transform: scale(0.98);
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .control-group {
                gap: 8px;
            }
            input[type="text"], select {
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ 幼兒園名片產生器 ✨</h2>
    
    <div class="control-group">
        <div class="input-box">
            <label>🖼️ 底圖風格</label>
            <select id="bgSelect">
                <option value="1000073981.jpg">🌞 陽光黃</option>
                <option value="1000073983.jpg">🌲 綠森林</option>
                <option value="1000073984.jpg">🏕️ 深綠色</option>
            </select>
        </div>
        <div class="input-box span-2">
            <label>📸 上傳大頭照</label>
            <input type="file" id="photoInput" accept="image/*">
        </div>
        
        <div class="input-box">
            <label>班級</label>
            <input type="text" id="classInput" placeholder="請輸入班級" value="中 班">
        </div>
        <div class="input-box">
            <label>姓名</label>
            <input type="text" id="nameInput" placeholder="請輸入姓名" value="黃亮齊">
        </div>
        <div class="input-box">
            <label>座號</label>
            <input type="text" id="seatInput" placeholder="請輸入座號" value="2 號">
        </div>
        
        <div class="photo-controls">
            <label style="display: block; margin-bottom: 8px; font-size: 13px;">🤏 調整相片位移與大小</label>
            <div class="slider-group">
                <label>縮放</label>
                <input type="range" id="scale" min="0.5" max="3" step="0.05" value="1">
            </div>
            <div class="slider-group">
                <label>左右</label>
                <input type="range" id="xOffset" min="-500" max="500" value="0">
            </div>
            <div class="slider-group">
                <label>上下</label>
                <input type="range" id="yOffset" min="-500" max="500" value="0">
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="myCanvas"></canvas>
    </div>

    <button class="btn-download" id="downloadBtn">📥 儲存圖片到手機 (長10cm)</button>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW Registered'))
                .catch(err => console.log('SW Reg error: ', err));
        });
    }

    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    
    const baseImg = new Image();
    baseImg.src = document.getElementById('bgSelect').value; 
    let userImg = null;

    document.getElementById('bgSelect').addEventListener('change', function(e) {
        baseImg.src = e.target.value;
    });

    const inputs = ['classInput', 'nameInput', 'seatInput', 'scale', 'xOffset', 'yOffset'];
    inputs.forEach(id => {
        document.getElementById(id).addEventListener('input', draw);
    });

    document.getElementById('photoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                userImg = new Image();
                userImg.onload = draw;
                userImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    baseImg.onload = () => {
        canvas.width = baseImg.width;
        canvas.height = baseImg.height;
        draw();
    };

    function roundedRectPath(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    function draw() {
        if (!baseImg.complete) return;

        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(baseImg, 0, 0, w, h);

        if (userImg) {
            ctx.save();
            const frameX = w * 0.654;
            const frameY = h * 0.125;
            const frameW = w * 0.288;
            const frameH = h * 0.555;
            const frameRadius = w * 0.035;

            roundedRectPath(ctx, frameX, frameY, frameW, frameH, frameRadius);
            ctx.clip();

            const scale = parseFloat(document.getElementById('scale').value);
            const dx = parseFloat(document.getElementById('xOffset').value);
            const dy = parseFloat(document.getElementById('yOffset').value);

            const imgAspect = userImg.width / userImg.height;
            const frameAspect = frameW / frameH;
            let drawW, drawH;

            if (imgAspect > frameAspect) {
                drawH = frameH;
                drawW = userImg.width * (frameH / userImg.height);
            } else {
                drawW = frameW;
                drawH = userImg.height * (frameW / userImg.width);
            }

            drawW *= scale;
            drawH *= scale;

            const drawX = frameX + (frameW - drawW) / 2 + dx;
            const drawY = frameY + (frameH - drawH) / 2 + dy;

            ctx.drawImage(userImg, drawX, drawY, drawW, drawH);
            ctx.restore();
        }

        ctx.fillStyle = '#222222';
        ctx.font = `bold ${h * 0.095}px "Microsoft JhengHei", sans-serif`;
        ctx.textBaseline = 'middle';

        const classText = document.getElementById('classInput').value;
        const nameText = document.getElementById('nameInput').value;
        const seatText = document.getElementById('seatInput').value;

        const textX = w * 0.33;
        ctx.fillText(classText, textX, h * 0.45);
        ctx.fillText(nameText, textX, h * 0.59);
        ctx.fillText(seatText, textX, h * 0.73);
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const studentName = document.getElementById('nameInput').value.trim() || '學生';

        const targetWidth = Math.round(10 * 118.11);
        const aspectRatio = canvas.height / canvas.width;
        const targetHeight = Math.round(targetWidth * aspectRatio);

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = targetWidth;
        exportCanvas.height = targetHeight;
        const exportCtx = exportCanvas.getContext('2d');

        exportCtx.imageSmoothingEnabled = true;
        exportCtx.imageSmoothingQuality = 'high';
        exportCtx.drawImage(canvas, 0, 0, targetWidth, targetHeight);

        const dataURL = exportCanvas.toDataURL('image/jpeg', 0.95);
        const link = document.createElement('a');
        
        link.download = `${studentName}_名片_10cm.jpg`; 
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
