<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幼兒園名片產生器 - 6張A4併印版</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff8a65">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", 'Microsoft JhengHei', sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            max-width: 650px;
            width: 100%;
        }
        h2 { text-align: center; color: #ff8a65; margin-top: 0; margin-bottom: 15px; font-size: 22px; }
        
        /* 頁籤選擇 */
        .student-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tab-btn {
            flex: 1;
            min-width: 75px;
            padding: 8px 5px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
        }
        .tab-btn.active {
            background: #ff8a65;
            color: white;
            border-color: #ff8a65;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-box { display: flex; flex-direction: column; }
        .span-2 { grid-column: span 2; }
        .span-3 { grid-column: span 3; }
        label { font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        input[type="text"], input[type="file"], select {
            padding: 8px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            width: 100%;
            background-color: #fafafa;
        }
        input[type="text"]:focus, select:focus { border-color: #ff8a65; background-color: #fff; }
        
        .photo-controls {
            grid-column: span 3;
            background: #fff9e6;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed #ffcc80;
        }
        .slider-group { display: flex; align-items: center; margin-bottom: 6px; }
        .slider-group:last-child { margin-bottom: 0; }
        .slider-group label { width: 50px; margin-bottom: 0; font-size: 12px; }
        input[type="range"] { flex-grow: 1; accent-color: #ff8a65; }

        .view-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .view-btn {
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid #ff8a65;
            background: white;
            color: #ff8a65;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .view-btn.active { background: #ff8a65; color: white; }

        .canvas-container {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid #eee;
            margin-bottom: 15px;
            position: relative;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas { width: 100%; height: auto; display: block; }
        
        .btn-download {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            transition: all 0.2s;
        }
        .btn-download:active { transform: scale(0.98); }

        .toast-msg {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }
        .toast-success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .toast-error { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ 幼兒園名片併印產生器 (6張) ✨</h2>
    
    <!-- 全局底圖風格選擇 -->
    <div class="control-group">
        <div class="input-box span-3">
            <label>🖼️ 套用名片底圖風格 (全部6張)</label>
            <select id="bgSelect">
                <option value="1000073981.png">🌞 陽光黃</option>
                <option value="1000073983.png">🌲 綠森林</option>
                <option value="1000073984.png">🏕️ 深綠色</option>
                <option value="1784874155351.png">🏡 童話小鎮 A</option>
                <option value="1784874240076.png">🚀 夢幻太空 A</option>
                <option value="1784876186703_2.png">🏡 童話小鎮 B</option>
                <option value="1784875917011_2.png">🚀 夢幻太空 B</option>
            </select>
        </div>
    </div>

    <!-- 6位學生分頁按鈕 -->
    <label>請選擇要編輯的學生卡位：</label>
    <div class="student-tabs" id="tabsContainer">
        <!-- JS 動態生成 6 個 Tab -->
    </div>

    <!-- 當前學生的資料輸入區 -->
    <div class="control-group">
        <div class="input-box span-3">
            <label id="currentStudentLabel">📸 上傳【學生 1】照片</label>
            <input type="file" id="photoInput" accept="image/*">
        </div>
        
        <div class="input-box">
            <label>班級</label>
            <input type="text" id="classInput" placeholder="班級">
        </div>
        <div class="input-box">
            <label>姓名</label>
            <input type="text" id="nameInput" placeholder="姓名">
        </div>
        <div class="input-box">
            <label>座號</label>
            <input type="text" id="seatInput" placeholder="座號">
        </div>
        
        <div class="photo-controls">
            <label style="display: block; margin-bottom: 6px; font-size: 12px;">🤏 調整當前相片</label>
            <div class="slider-group">
                <label>縮放</label>
                <input type="range" id="scale" min="0.5" max="3" step="0.05" value="1">
            </div>
            <div class="slider-group">
                <label>左右</label>
                <input type="range" id="xOffset" min="-500" max="500" value="0">
            </div>
            <div class="slider-group">
                <label>上下</label>
                <input type="range" id="yOffset" min="-500" max="500" value="0">
            </div>
        </div>
    </div>

    <!-- 切換畫布預覽模式 -->
    <div class="view-switch">
        <button class="view-btn active" id="viewSingleBtn">🔍 預覽當前單張</button>
        <button class="view-btn" id="viewA4Btn">🖨️ 預覽 A4 6張滿版</button>
    </div>

    <div class="canvas-container">
        <canvas id="myCanvas"></canvas>
    </div>

    <button class="btn-download" id="downloadA4Btn">🖨️ 輸出 A4 列印檔 (下載到手機)</button>
    
    <div class="toast-msg" id="toastMsg"></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Reg error: ', err));
        });
    }

    // 初始化 6 位學生的資料結構
    let currentIdx = 0;
    const students = Array.from({ length: 6 }, (_, i) => ({
        id: i + 1,
        classText: '',
        nameText: '',
        seatText: '',
        userImg: null,
        scale: 1,
        xOffset: 0,
        yOffset: 0
    }));

    let currentViewMode = 'single'; // 'single' 或 'a4'
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const baseImg = new Image();

    // 建立 6 個學生 Tab 頁籤
    const tabsContainer = document.getElementById('tabsContainer');
    students.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
        btn.innerText = `學生 ${s.id}`;
        btn.addEventListener('click', () => switchStudent(idx));
        tabsContainer.appendChild(btn);
    });

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = msg;
        toast.className = `toast-msg toast-${type}`;
        toast.style.display = 'block';
    }

    function hideToast() {
        document.getElementById('toastMsg').style.display = 'none';
    }

    function loadBaseImage(src) {
        baseImg.onload = () => {
            hideToast();
            render();
        };
        baseImg.onerror = () => {
            showToast(`❌ <strong>底圖載入失敗！</strong><br>找不到檔案：<code>${src}</code>`, 'error');
        };
        baseImg.src = src;
    }

    loadBaseImage(document.getElementById('bgSelect').value);

    document.getElementById('bgSelect').addEventListener('change', (e) => {
        loadBaseImage(e.target.value);
    });

    // 切換當前編輯的學生
    function switchStudent(idx) {
        currentIdx = idx;
        const btns = tabsContainer.querySelectorAll('.tab-btn');
        btns.forEach((b, i) => b.classList.toggle('active', i === idx));

        document.getElementById('currentStudentLabel').innerText = `📸 上傳【學生 ${idx + 1}】照片`;
        
        // 載入該學生的資料到控制項
        const s = students[currentIdx];
        document.getElementById('classInput').value = s.classText;
        document.getElementById('nameInput').value = s.nameText;
        document.getElementById('seatInput').value = s.seatText;
        document.getElementById('scale').value = s.scale;
        document.getElementById('xOffset').value = s.xOffset;
        document.getElementById('yOffset').value = s.yOffset;
        
        // 重置檔案上傳 input 顯示
        document.getElementById('photoInput').value = '';

        render();
    }

    // 輸入監聽事件同步回資料陣列
    const textInputs = ['classInput', 'nameInput', 'seatInput'];
    textInputs.forEach(id => {
        document.getElementById(id).addEventListener('input', function() {
            let val = this.value.replace(/\s+/g, '');
            let spacedVal = val.split('').join(' ');
            if (this.value !== spacedVal) this.value = spacedVal;

            if (id === 'classInput') students[currentIdx].classText = this.value;
            if (id === 'nameInput') students[currentIdx].nameText = this.value;
            if (id === 'seatInput') students[currentIdx].seatText = this.value;

            render();
        });
    });

    ['scale', 'xOffset', 'yOffset'].forEach(id => {
        document.getElementById(id).addEventListener('input', function() {
            students[currentIdx][id] = parseFloat(this.value);
            render();
        });
    });

    document.getElementById('photoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = () => {
                    students[currentIdx].userImg = img;
                    render();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // 圓角輔助函式
    function roundedRectPath(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    // 繪製單張名片至指定的 Canvas Context
    function drawCard(targetCtx, sData, w, h) {
        targetCtx.drawImage(baseImg, 0, 0, w, h);

        if (sData.userImg) {
            targetCtx.save();
            const frameX = w * 0.654;
            const frameY = h * 0.125;
            const frameW = w * 0.288;
            const frameH = h * 0.555;
            const frameRadius = w * 0.035;

            roundedRectPath(targetCtx, frameX, frameY, frameW, frameH, frameRadius);
            targetCtx.clip();

            const imgAspect = sData.userImg.width / sData.userImg.height;
            const frameAspect = frameW / frameH;
            let drawW, drawH;

            if (imgAspect > frameAspect) {
                drawH = frameH;
                drawW = sData.userImg.width * (frameH / sData.userImg.height);
            } else {
                drawW = frameW;
                drawH = sData.userImg.height * (frameW / sData.userImg.width);
            }

            drawW *= sData.scale;
            drawH *= sData.scale;

            const drawX = frameX + (frameW - drawW) / 2 + sData.xOffset;
            const drawY = frameY + (frameH - drawH) / 2 + sData.yOffset;

            targetCtx.drawImage(sData.userImg, drawX, drawY, drawW, drawH);
            targetCtx.restore();
        }

        targetCtx.fillStyle = '#222222';
        targetCtx.font = `bold ${h * 0.095}px "Microsoft JhengHei", sans-serif`;
        targetCtx.textBaseline = 'middle';

        const textX = w * 0.33;
        targetCtx.fillText(sData.classText, textX, h * 0.45);
        targetCtx.fillText(sData.nameText, textX, h * 0.59);
        targetCtx.fillText(sData.seatText, textX, h * 0.73);
    }

    // 生成單張名片的獨立 Offscreen Canvas
    function createCardCanvas(sData) {
        const c = document.createElement('canvas');
        c.width = baseImg.width;
        c.height = baseImg.height;
        const cCtx = c.getContext('2d');
        cCtx.imageSmoothingEnabled = true;
        cCtx.imageSmoothingQuality = 'high';
        drawCard(cCtx, sData, baseImg.width, baseImg.height);
        return c;
    }

    // 畫面總渲染器
    function render() {
        if (!baseImg.complete || baseImg.width === 0) return;

        if (currentViewMode === 'single') {
            canvas.width = baseImg.width;
            canvas.height = baseImg.height;
            drawCard(ctx, students[currentIdx], canvas.width, canvas.height);
        } else {
            // A4 預覽渲染 (2480 x 3508 像素規格)
            canvas.width = 2480;
            canvas.height = 3508;
            renderA4(ctx, canvas.width, canvas.height);
        }
    }

    // 繪製 A4 全頁
    function renderA4(targetCtx, a4W, a4H) {
        targetCtx.fillStyle = '#ffffff';
        targetCtx.fillRect(0, 0, a4W, a4H);

        const cardWidth = Math.round(a4W * 0.42);
        const cardHeight = Math.round(cardWidth * (baseImg.height / baseImg.width));

        const cols = 2;
        const rows = 3;
        const gapX = (a4W - (cols * cardWidth)) / (cols + 1);
        const gapY = (a4H - (rows * cardHeight)) / (rows + 1);

        students.forEach((sData, idx) => {
            const r = Math.floor(idx / cols);
            const c = idx % cols;
            const x = gapX + c * (cardWidth + gapX);
            const y = gapY + r * (cardHeight + gapY);

            const cardCanvas = createCardCanvas(sData);
            targetCtx.drawImage(cardCanvas, x, y, cardWidth, cardHeight);

            // 裁切邊線
            targetCtx.strokeStyle = '#cccccc';
            targetCtx.lineWidth = 2;
            targetCtx.strokeRect(x, y, cardWidth, cardHeight);
        });
    }

    // 切換檢視按鈕
    document.getElementById('viewSingleBtn').addEventListener('click', function() {
        currentViewMode = 'single';
        this.classList.add('active');
        document.getElementById('viewA4Btn').classList.remove('active');
        render();
    });

    document.getElementById('viewA4Btn').addEventListener('click', function() {
        currentViewMode = 'a4';
        this.classList.add('active');
        document.getElementById('viewSingleBtn').classList.remove('active');
        render();
    });

    // 輸出與下載 A4 PNG
    document.getElementById('downloadA4Btn').addEventListener('click', () => {
        const fileName = `幼兒園名片6張併印_A4.png`;

        const a4Canvas = document.createElement('canvas');
        a4Canvas.width = 2480;
        a4Canvas.height = 3508;
        const a4Ctx = a4Canvas.getContext('2d');
        a4Ctx.imageSmoothingEnabled = true;
        a4Ctx.imageSmoothingQuality = 'high';

        renderA4(a4Ctx, a4Canvas.width, a4Canvas.height);

        const link = document.createElement('a');
        link.download = fileName;
        link.href = a4Canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast(`🎉 <strong>下載完成！</strong><br>📁 檔名：<code>${fileName}</code><br>📍 圖檔已自動儲存至您手機/電腦的「下載資料夾」！`, 'success');

        setTimeout(() => hideToast(), 6000);
    });
</script>

</body>
</html>
