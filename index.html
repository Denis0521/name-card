<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幼兒園名片產生器</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff8a65">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", 'Microsoft JhengHei', sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #ff8a65;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .span-2 {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            margin-bottom: 6px;
            color: #555;
            font-size: 13px;
        }
        input[type="text"], input[type="file"], select {
            padding: 10px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            width: 100%;
            background-color: #fafafa;
            transition: all 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #ff8a65;
            background-color: #fff;
        }
        .photo-controls {
            grid-column: span 3;
            background: #fff9e6;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #ffcc80;
        }
        .slider-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .slider-group:last-child {
            margin-bottom: 0;
        }
        .slider-group label {
            width: 60px;
            margin-bottom: 0;
            font-size: 13px;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: #ff8a65;
        }
        .canvas-container {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid #eee;
            margin-bottom: 20px;
            position: relative;
            background-color: #eee;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-download {
            background-color: #ff8a65;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 138, 101, 0.3);
            transition: all 0.2s;
        }
        .btn-download.btn-a4 {
            background-color: #4caf50;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .btn-download:active {
            transform: scale(0.98);
        }
        /* 提示訊息樣式 */
        .toast-msg {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }
        .toast-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .toast-error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .control-group {
                gap: 8px;
            }
            input[type="text"], select {
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ 幼兒園名片產生器 ✨</h2>
    
    <div class="control-group">
        <div class="input-box">
            <label>🖼️ 底圖風格</label>
            <select id="bgSelect">
                <option value="1000073981.png">🌞 陽光黃</option>
                <option value="1000073983.png">🌲 綠森林</option>
                <option value="1000073984.png">🏕️ 深綠色</option>
                <option value="1784874155351.png">🏡 童話小鎮 A</option>
                <option value="1784874240076.png">🚀 夢幻太空 A</option>
                <option value="1784876186703_2.png">🏡 童話小鎮 B</option>
                <option value="1784875917011_2.png">🚀 夢幻太空 B</option>
            </select>
        </div>
        <div class="input-box span-2">
            <label>📸 上傳大頭照</label>
            <input type="file" id="photoInput" accept="image/*">
        </div>
        
        <div class="input-box">
            <label>班級</label>
            <input type="text" id="classInput" placeholder="請輸入班級" value="">
        </div>
        <div class="input-box">
            <label>姓名</label>
            <input type="text" id="nameInput" placeholder="請輸入姓名" value="">
        </div>
        <div class="input-box">
            <label>座號</label>
            <input type="text" id="seatInput" placeholder="請輸入座號" value="">
        </div>
        
        <div class="photo-controls">
            <label style="display: block; margin-bottom: 8px; font-size: 13px;">🤏 調整相片位移與大小</label>
            <div class="slider-group">
                <label>縮放</label>
                <input type="range" id="scale" min="0.5" max="3" step="0.05" value="1">
            </div>
            <div class="slider-group">
                <label>左右</label>
                <input type="range" id="xOffset" min="-500" max="500" value="0">
            </div>
            <div class="slider-group">
                <label>上下</label>
                <input type="range" id="yOffset" min="-500" max="500" value="0">
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="myCanvas"></canvas>
    </div>

    <div class="button-group">
        <button class="btn-download" id="downloadBtn">📥 儲存單張名片 (長10cm)</button>
        <button class="btn-download btn-a4" id="downloadA4Btn">🖨️ 輸出 A4 列印檔 (6張張/頁)</button>
    </div>
    
    <!-- 提示訊息 -->
    <div class="toast-msg" id="toastMsg"></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('SW Registered', reg);
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                showToast(`⚠️ <strong>發現新版本！</strong><br>已更新主題資源，請重新整理頁面。`, 'error');
                            }
                        };
                    };
                })
                .catch(err => console.log('SW Reg error: ', err));
        });
    }

    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    
    const baseImg = new Image();
    let userImg = null;

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = msg;
        toast.className = `toast-msg toast-${type}`;
        toast.style.display = 'block';
    }

    function hideToast() {
        const toast = document.getElementById('toastMsg');
        toast.style.display = 'none';
    }

    function loadBaseImage(src) {
        baseImg.onload = () => {
            canvas.width = baseImg.width;
            canvas.height = baseImg.height;
            hideToast();
            draw();
        };
        baseImg.onerror = () => {
            console.error('無法載入底圖：', src);
            showToast(`❌ <strong>底圖載入失敗！</strong><br>找不到檔案：<code>${src}</code><br>請確認專案資料夾內是否有該圖片。`, 'error');
        };
        baseImg.src = src;
    }

    loadBaseImage(document.getElementById('bgSelect').value);

    document.getElementById('bgSelect').addEventListener('change', function(e) {
        loadBaseImage(e.target.value);
    });

    const textInputs = ['classInput', 'nameInput', 'seatInput'];
    textInputs.forEach(id => {
        const inputEl = document.getElementById(id);
        inputEl.addEventListener('input', function(e) {
            let val = this.value.replace(/\s+/g, ''); 
            let spacedVal = val.split('').join(' '); 
            if (this.value !== spacedVal) {
                this.value = spacedVal;
            }
            draw();
        });
    });

    const otherInputs = ['scale', 'xOffset', 'yOffset'];
    otherInputs.forEach(id => {
        document.getElementById(id).addEventListener('input', draw);
    });

    document.getElementById('photoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                userImg = new Image();
                userImg.onload = draw;
                userImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    function roundedRectPath(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    function draw() {
        if (!baseImg.complete || baseImg.width === 0) return;

        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        ctx.drawImage(baseImg, 0, 0, w, h);

        if (userImg) {
            ctx.save();
            const frameX = w * 0.654;
            const frameY = h * 0.125;
            const frameW = w * 0.288;
            const frameH = h * 0.555;
            const frameRadius = w * 0.035;

            roundedRectPath(ctx, frameX, frameY, frameW, frameH, frameRadius);
            ctx.clip();

            const scale = parseFloat(document.getElementById('scale').value);
            const dx = parseFloat(document.getElementById('xOffset').value);
            const dy = parseFloat(document.getElementById('yOffset').value);

            const imgAspect = userImg.width / userImg.height;
            const frameAspect = frameW / frameH;
            let drawW, drawH;

            if (imgAspect > frameAspect) {
                drawH = frameH;
                drawW = userImg.width * (frameH / userImg.height);
            } else {
                drawW = frameW;
                drawH = userImg.height * (frameW / userImg.width);
            }

            drawW *= scale;
            drawH *= scale;

            const drawX = frameX + (frameW - drawW) / 2 + dx;
            const drawY = frameY + (frameH - drawH) / 2 + dy;

            ctx.drawImage(userImg, drawX, drawY, drawW, drawH);
            ctx.restore();
        }

        ctx.fillStyle = '#222222';
        ctx.font = `bold ${h * 0.095}px "Microsoft JhengHei", sans-serif`;
        ctx.textBaseline = 'middle';

        const classText = document.getElementById('classInput').value;
        const nameText = document.getElementById('nameInput').value;
        const seatText = document.getElementById('seatInput').value;

        const textX = w * 0.33;
        ctx.fillText(classText, textX, h * 0.45);
        ctx.fillText(nameText, textX, h * 0.59);
        ctx.fillText(seatText, textX, h * 0.73);
    }

    // 單張下載功能
    document.getElementById('downloadBtn').addEventListener('click', () => {
        const rawName = document.getElementById('nameInput').value.trim();
        const studentName = rawName ? rawName.replace(/\s+/g, '') : '學生';
        const fileName = `${studentName}_名片_10cm.png`;

        const targetWidth = Math.round(10 * 118.11);
        const aspectRatio = canvas.height / canvas.width;
        const targetHeight = Math.round(targetWidth * aspectRatio);

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = targetWidth;
        exportCanvas.height = targetHeight;
        const exportCtx = exportCanvas.getContext('2d');

        exportCtx.imageSmoothingEnabled = true;
        exportCtx.imageSmoothingQuality = 'high';
        exportCtx.drawImage(canvas, 0, 0, targetWidth, targetHeight);

        triggerDownload(exportCanvas.toDataURL('image/png'), fileName);
    });

    // 新增：A4 6張排版下載功能
    document.getElementById('downloadA4Btn').addEventListener('click', () => {
        const rawName = document.getElementById('nameInput').value.trim();
        const studentName = rawName ? rawName.replace(/\s+/g, '') : '學生';
        const fileName = `${studentName}_名片_A4併印6張.png`;

        // 300 DPI 下的 A4 尺寸 (像素)
        const a4Width = 2480;  // 210mm
        const a4Height = 3508; // 297mm

        const a4Canvas = document.createElement('canvas');
        a4Canvas.width = a4Width;
        a4Canvas.height = a4Height;
        const a4Ctx = a4Canvas.getContext('2d');

        // 白底
        a4Ctx.fillStyle = '#ffffff';
        a4Ctx.fillRect(0, 0, a4Width, a4Height);
        a4Ctx.imageSmoothingEnabled = true;
        a4Ctx.imageSmoothingQuality = 'high';

        // 單張名片尺寸：寬 90mm (約 1063px)，高以比例繪製
        const cardWidth = Math.round(a4Width * 0.42); 
        const cardHeight = Math.round(cardWidth * (canvas.height / canvas.width));

        const cols = 2;
        const rows = 3;

        // 計算邊距與間距以均勻排列 6 張名片
        const totalXGap = a4Width - (cols * cardWidth);
        const gapX = totalXGap / (cols + 1);

        const totalYGap = a4Height - (rows * cardHeight);
        const gapY = totalYGap / (rows + 1);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = gapX + c * (cardWidth + gapX);
                const y = gapY + r * (cardHeight + gapY);

                // 畫名片本體
                a4Ctx.drawImage(canvas, x, y, cardWidth, cardHeight);

                // 畫輕微剪裁外框線
                a4Ctx.strokeStyle = '#cccccc';
                a4Ctx.lineWidth = 2;
                a4Ctx.strokeRect(x, y, cardWidth, cardHeight);
            }
        }

        triggerDownload(a4Canvas.toDataURL('image/png'), fileName);
    });

    // 觸發下載通用函式
    function triggerDownload(dataURL, fileName) {
        const link = document.createElement('a');
        link.download = fileName;
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast(`🎉 <strong>下載完成！</strong><br>📁 檔名：<code>${fileName}</code><br>📍 已儲存至手機/電腦的「下載資料夾」或相簿。`, 'success');

        setTimeout(() => {
            hideToast();
        }, 6000);
    }
</script>

</body>
</html>
