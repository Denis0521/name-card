<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幼兒園名片產生器 - 專業升級版</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff8a65">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- 引入 jsPDF 用於匯出 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", 'Microsoft JhengHei', sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            max-width: 650px;
            width: 100%;
        }
        h2 { text-align: center; color: #ff8a65; margin-top: 0; margin-bottom: 15px; font-size: 22px; }
        
        /* 學生頁籤與動態操作 */
        .tabs-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .student-tabs { display: flex; gap: 5px; }
        .tab-btn {
            padding: 8px 12px; background: #f0f0f0; border: 1px solid #ddd;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap;
        }
        .tab-btn.active { background: #ff8a65; color: white; border-color: #ff8a65; }
        .btn-icon { background: #e0e0e0; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: #ccc; }

        /* RWD 網格設定 */
        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-box { display: flex; flex-direction: column; }
        .span-2 { grid-column: span 2; }
        .span-3 { grid-column: span 3; }
        
        /* 手機版單欄配置 */
        @media (max-width: 768px) {
            .control-group { grid-template-columns: 1fr; }
            .span-2, .span-3 { grid-column: span 1; }
        }

        label { font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        input[type="text"], input[type="file"], select {
            padding: 8px; border: 1.5px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; font-weight: bold; outline: none; width: 100%; background-color: #fafafa;
        }
        input[type="text"]:focus, select:focus { border-color: #ff8a65; background-color: #fff; }
        
        .photo-controls { grid-column: span 3; background: #fff9e6; padding: 12px; border-radius: 12px; border: 1px dashed #ffcc80; position: relative; }
        @media (max-width: 768px) { .photo-controls { grid-column: span 1; } }
        
        .reset-btn { position: absolute; top: 10px; right: 10px; padding: 4px 8px; font-size: 11px; background: #ffcc80; border: none; border-radius: 4px; cursor: pointer; }
        .reset-btn:hover { background: #ffb74d; }
        
        .slider-group { display: flex; align-items: center; margin-bottom: 6px; }
        .slider-group:last-child { margin-bottom: 0; }
        .slider-group label { width: 50px; margin-bottom: 0; font-size: 12px; }
        input[type="range"] { flex-grow: 1; accent-color: #ff8a65; }

        .view-switch { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .view-btn { padding: 6px 15px; border-radius: 20px; border: 1px solid #ff8a65; background: white; color: #ff8a65; font-weight: bold; cursor: pointer; font-size: 13px; }
        .view-btn.active { background: #ff8a65; color: white; }

        .canvas-container { width: 100%; overflow: hidden; border-radius: 12px; border: 2px solid #eee; margin-bottom: 15px; background-color: #e0e0e0; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: auto; display: block; }
        
        .button-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-download { color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 30px; cursor: pointer; width: 100%; font-weight: bold; transition: all 0.2s; }
        .btn-single { background-color: #ff8a65; box-shadow: 0 4px 12px rgba(255, 138, 101, 0.3); }
        .btn-a4-png { background-color: #4caf50; box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3); }
        .btn-a4-pdf { background-color: #2196F3; box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3); }
        .btn-download:active { transform: scale(0.98); }

        .toast-msg { display: none; margin-top: 15px; padding: 12px 15px; border-radius: 12px; font-size: 14px; text-align: center; }
        .toast-success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ 幼兒園名片產生器 ✨</h2>
    
    <label>請選擇要編輯的學生：</label>
    <div class="tabs-wrapper">
        <div class="student-tabs" id="tabsContainer"></div>
        <button class="btn-icon" id="addStudentBtn" title="新增學生">➕</button>
        <button class="btn-icon" id="removeStudentBtn" title="刪除當前學生" style="color:red;">🗑️</button>
    </div>

    <div class="control-group">
        <div class="input-box span-3">
            <label id="bgSelectLabel">🖼️ 底圖風格</label>
            <select id="bgSelect">
                <option value="1000073981.png">🌞 陽光黃</option>
                <option value="1000073983.png">🌲 綠森林</option>
                <option value="1000073984.png">🏕️ 深綠色</option>
                <option value="1784874155351.png">🏡 童話小鎮 A</option>
                <option value="1784874240076.png">🚀 夢幻太空 A</option>
                <option value="1784876186703_2.png">🏡 童話小鎮 B</option>
                <option value="1784875917011_2.png">🚀 夢幻太空 B</option>
            </select>
        </div>

        <div class="input-box span-3">
            <label id="currentStudentLabel">📸 上傳大頭照</label>
            <input type="file" id="photoInput" accept="image/*">
        </div>
        
        <div class="input-box">
            <label>班級</label>
            <input type="text" id="classInput" placeholder="班級">
        </div>
        <div class="input-box">
            <label>姓名</label>
            <input type="text" id="nameInput" placeholder="姓名">
        </div>
        <div class="input-box">
            <label>座號</label>
            <input type="text" id="seatInput" placeholder="座號">
        </div>
        
        <div class="photo-controls">
            <button class="reset-btn" id="resetPhotoBtn">🔄 重設照片</button>
            <label style="display: block; margin-bottom: 6px; font-size: 12px;">🤏 調整當前相片位移與大小</label>
            <div class="slider-group"><label>縮放</label><input type="range" id="scale" min="0.5" max="3" step="0.05" value="1"></div>
            <div class="slider-group"><label>左右</label><input type="range" id="xOffset" min="-500" max="500" value="0"></div>
            <div class="slider-group"><label>上下</label><input type="range" id="yOffset" min="-500" max="500" value="0"></div>
        </div>
    </div>

    <div class="view-switch">
        <button class="view-btn active" id="viewSingleBtn">🔍 預覽當前單張</button>
        <button class="view-btn" id="viewA4Btn">🖨️ 預覽 A4 排版</button>
    </div>

    <div class="canvas-container">
        <canvas id="myCanvas"></canvas>
    </div>

    <div class="button-group">
        <button class="btn-download btn-single" id="downloadSingleBtn">📥 儲存單張名片 (PNG)</button>
        <button class="btn-download btn-a4-pdf" id="downloadA4PdfBtn">📄 輸出 A4 列印檔 (PDF)</button>
    </div>
    
    <div class="toast-msg" id="toastMsg"></div>
</div>

<script>
    const baseImgCache = {};
    let students = [];
    let currentIdx = 0;
    let currentViewMode = 'single';
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');

    // 預載底圖
    function getBaseImage(src) {
        if (!baseImgCache[src]) {
            const img = new Image();
            img.src = src;
            img.onload = () => render();
            baseImgCache[src] = img;
        }
        return baseImgCache[src];
    }

    // 初始化與讀取暫存
    function init() {
        const savedData = localStorage.getItem('kindergartenCards');
        if (savedData) {
            try {
                students = JSON.parse(savedData);
                // 恢復圖片物件
                students.forEach(s => {
                    if (s.userImgBase64) {
                        const img = new Image();
                        img.onload = () => render();
                        img.src = s.userImgBase64;
                        s.userImg = img;
                    }
                });
            } catch (e) { console.error("讀取暫存失敗", e); students = []; }
        }

        if (students.length === 0) {
            for(let i=0; i<6; i++) addNewStudent();
        }
        buildTabs();
        switchStudent(0);
    }

    function saveToStorage() {
        const dataToSave = students.map(s => {
            const clone = {...s};
            delete clone.userImg; // 避免循環結構，只存 base64
            return clone;
        });
        try {
            localStorage.setItem('kindergartenCards', JSON.stringify(dataToSave));
            updateTabUI();
        } catch (e) { console.warn("暫存空間可能已滿"); }
    }

    function createNewStudentObj() {
        return {
            id: Date.now(),
            bgSrc: '1000073981.png',
            classText: '', nameText: '', seatText: '',
            userImg: null, userImgBase64: '',
            scale: 1, xOffset: 0, yOffset: 0
        };
    }

    function addNewStudent() {
        students.push(createNewStudentObj());
        buildTabs();
        saveToStorage();
    }

    // 更新 Tab 介面（加上完成狀態 ✅）
    function buildTabs() {
        const container = document.getElementById('tabsContainer');
        container.innerHTML = '';
        students.forEach((s, idx) => {
            const isCompleted = s.nameText.trim() !== '' && s.userImg !== null;
            const btn = document.createElement('button');
            btn.className = `tab-btn ${idx === currentIdx ? 'active' : ''}`;
            btn.innerText = `學生 ${idx + 1} ${isCompleted ? '✅' : ''}`;
            btn.addEventListener('click', () => switchStudent(idx));
            container.appendChild(btn);
        });
    }

    function updateTabUI() {
        const btns = document.querySelectorAll('.tab-btn');
        students.forEach((s, idx) => {
            const isCompleted = s.nameText.trim() !== '' && s.userImg !== null;
            if (btns[idx]) {
                btns[idx].innerText = `學生 ${idx + 1} ${isCompleted ? '✅' : ''}`;
            }
        });
    }

    function switchStudent(idx) {
        currentIdx = idx;
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        
        const s = students[currentIdx];
        document.getElementById('bgSelectLabel').innerText = `🖼️ 【學生 ${idx + 1}】底圖`;
        document.getElementById('bgSelect').value = s.bgSrc;
        document.getElementById('classInput').value = s.classText;
        document.getElementById('nameInput').value = s.nameText;
        document.getElementById('seatInput').value = s.seatText;
        document.getElementById('scale').value = s.scale;
        document.getElementById('xOffset').value = s.xOffset;
        document.getElementById('yOffset').value = s.yOffset;
        document.getElementById('photoInput').value = '';
        render();
    }

    // 綁定事件
    document.getElementById('addStudentBtn').addEventListener('click', () => { addNewStudent(); switchStudent(students.length - 1); });
    document.getElementById('removeStudentBtn').addEventListener('click', () => {
        if (students.length <= 1) return alert("至少需保留一位學生！");
        if (confirm("確定要刪除這位學生的資料嗎？")) {
            students.splice(currentIdx, 1);
            currentIdx = Math.max(0, currentIdx - 1);
            buildTabs();
            switchStudent(currentIdx);
            saveToStorage();
        }
    });

    document.getElementById('resetPhotoBtn').addEventListener('click', () => {
        students[currentIdx].scale = 1;
        students[currentIdx].xOffset = 0;
        students[currentIdx].yOffset = 0;
        document.getElementById('scale').value = 1;
        document.getElementById('xOffset').value = 0;
        document.getElementById('yOffset').value = 0;
        render();
        saveToStorage();
    });

    document.getElementById('bgSelect').addEventListener('change', (e) => {
        students[currentIdx].bgSrc = e.target.value;
        getBaseImage(e.target.value);
        saveToStorage();
        render();
    });

    ['classInput', 'nameInput', 'seatInput'].forEach(id => {
        document.getElementById(id).addEventListener('input', function() {
            let val = this.value.replace(/\s+/g, '').split('').join(' ');
            if (this.value !== val) this.value = val;
            const key = id.replace('Input', 'Text');
            students[currentIdx][key] = this.value;
            saveToStorage();
            render();
        });
    });

    ['scale', 'xOffset', 'yOffset'].forEach(id => {
        document.getElementById(id).addEventListener('input', function() {
            students[currentIdx][id] = parseFloat(this.value);
            saveToStorage();
            render();
        });
    });

    // 圖片壓縮與上傳
    document.getElementById('photoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = () => {
                // 背景壓縮機制避免 localStorage 爆滿
                const offCanvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height = Math.round(height *= MAX_WIDTH / width);
                    width = MAX_WIDTH;
                }
                offCanvas.width = width; offCanvas.height = height;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(img, 0, 0, width, height);
                
                const compressedBase64 = offCanvas.toDataURL('image/jpeg', 0.8);
                students[currentIdx].userImgBase64 = compressedBase64;
                
                const compressedImg = new Image();
                compressedImg.onload = () => {
                    students[currentIdx].userImg = compressedImg;
                    saveToStorage();
                    render();
                };
                compressedImg.src = compressedBase64;
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 畫布繪製邏輯 (保留您原有的精準座標與圓角裁切)
    function roundedRectPath(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
    }

    function drawCard(targetCtx, sData, w, h) {
        const bImg = getBaseImage(sData.bgSrc);
        if (bImg && bImg.complete) targetCtx.drawImage(bImg, 0, 0, w, h);
        else { targetCtx.fillStyle = '#ffffff'; targetCtx.fillRect(0, 0, w, h); }

        if (sData.userImg) {
            targetCtx.save();
            const frameX = w * 0.654, frameY = h * 0.125, frameW = w * 0.288, frameH = h * 0.555, frameRadius = w * 0.035;
            roundedRectPath(targetCtx, frameX, frameY, frameW, frameH, frameRadius); targetCtx.clip();

            const imgAspect = sData.userImg.width / sData.userImg.height, frameAspect = frameW / frameH;
            let drawW, drawH;
            if (imgAspect > frameAspect) { drawH = frameH; drawW = sData.userImg.width * (frameH / sData.userImg.height); } 
            else { drawW = frameW; drawH = sData.userImg.height * (frameW / sData.userImg.width); }

            drawW *= sData.scale; drawH *= sData.scale;
            const drawX = frameX + (frameW - drawW) / 2 + sData.xOffset;
            const drawY = frameY + (frameH - drawH) / 2 + sData.yOffset;
            targetCtx.drawImage(sData.userImg, drawX, drawY, drawW, drawH);
            targetCtx.restore();
        }
        targetCtx.fillStyle = '#222222';
        targetCtx.font = `bold ${h * 0.095}px "Microsoft JhengHei", sans-serif`;
        targetCtx.textBaseline = 'middle';
        const textX = w * 0.33;
        targetCtx.fillText(sData.classText, textX, h * 0.45);
        targetCtx.fillText(sData.nameText, textX, h * 0.59);
        targetCtx.fillText(sData.seatText, textX, h * 0.73);
    }

    function createCardCanvas(sData) {
        const c = document.createElement('canvas');
        const bImg = getBaseImage(sData.bgSrc);
        c.width = (bImg && bImg.width) ? bImg.width : 1000; c.height = (bImg && bImg.height) ? bImg.height : 600;
        const cCtx = c.getContext('2d'); cCtx.imageSmoothingEnabled = true; cCtx.imageSmoothingQuality = 'high';
        drawCard(cCtx, sData, c.width, c.height); return c;
    }

    function render() {
        if (currentViewMode === 'single') {
            const bImg = getBaseImage(students[currentIdx].bgSrc);
            canvas.width = (bImg && bImg.width) ? bImg.width : 1000;
            canvas.height = (bImg && bImg.height) ? bImg.height : 600;
            drawCard(ctx, students[currentIdx], canvas.width, canvas.height);
        } else {
            canvas.width = 2480; canvas.height = 3508;
            renderA4(ctx, canvas.width, canvas.height);
        }
    }

    function renderA4(targetCtx, a4W, a4H) {
        targetCtx.fillStyle = '#ffffff'; targetCtx.fillRect(0, 0, a4W, a4H);
        const cardWidth = Math.round(a4W * 0.42), cardHeight = Math.round(cardWidth * 0.6);
        const cols = 2, rows = 3;
        const gapX = (a4W - (cols * cardWidth)) / (cols + 1), gapY = (a4H - (rows * cardHeight)) / (rows + 1);

        students.forEach((sData, idx) => {
            const r = Math.floor((idx % 6) / cols), c = (idx % 6) % cols;
            // 這裡只先預覽前6位，若需預覽多頁可再優化
            if(idx < 6) {
                const x = gapX + c * (cardWidth + gapX), y = gapY + r * (cardHeight + gapY);
                const cardCanvas = createCardCanvas(sData);
                targetCtx.drawImage(cardCanvas, x, y, cardWidth, cardHeight);
                targetCtx.strokeStyle = '#cccccc'; targetCtx.lineWidth = 2; targetCtx.strokeRect(x, y, cardWidth, cardHeight);
            }
        });
    }

    document.getElementById('viewSingleBtn').addEventListener('click', function() { currentViewMode = 'single'; this.classList.add('active'); document.getElementById('viewA4Btn').classList.remove('active'); render(); });
    document.getElementById('viewA4Btn').addEventListener('click', function() { currentViewMode = 'a4'; this.classList.add('active'); document.getElementById('viewSingleBtn').classList.remove('active'); render(); });

    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = msg; toast.className = 'toast-msg toast-success'; toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 6000);
    }

    document.getElementById('downloadSingleBtn').addEventListener('click', () => {
        const sData = students[currentIdx];
        const fileName = `${sData.nameText.trim().replace(/\s+/g, '') || `學生${currentIdx+1}`}_名片.png`;
        const singleCanvas = createCardCanvas(sData);
        const link = document.createElement('a');
        link.download = fileName; link.href = singleCanvas.toDataURL('image/png');
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        showToast(`🎉 成功下載：${fileName}`);
    });

    // 匯出 PDF 功能
    document.getElementById('downloadA4PdfBtn').addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        
        const a4W = 210, a4H = 297; // A4 尺寸 mm
        const cardW = 90, cardH = 54; // 名片標準尺寸 mm
        const gapX = (a4W - (2 * cardW)) / 3, gapY = (a4H - (3 * cardH)) / 4;

        let itemsOnPage = 0;
        students.forEach((sData, idx) => {
            if (itemsOnPage === 6) { doc.addPage(); itemsOnPage = 0; }
            const r = Math.floor(itemsOnPage / 2), c = itemsOnPage % 2;
            const x = gapX + c * (cardW + gapX), y = gapY + r * (cardH + gapY);
            
            const cardCanvas = createCardCanvas(sData);
            const imgData = cardCanvas.toDataURL('image/jpeg', 1.0);
            doc.addImage(imgData, 'JPEG', x, y, cardW, cardH);
            doc.setDrawColor(200, 200, 200); doc.rect(x, y, cardW, cardH);
            itemsOnPage++;
        });

        doc.save('幼兒園名片_列印檔.pdf');
        showToast(`🎉 成功下載 PDF！可直接列印`);
    });

    init();
</script>
</body>
</html>
